<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign-up Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="main">
      <p class="credit">
        Photo by <span class="underline">Joshua Earle</span> on
        <span class="underline">Unsplash</span>
      </p>
      <div class="form-container">
        <div class="form-header">
          <p class="header-text">
            This is not a real online service! You know you need something like
            this in your life to help you realize your deepest dreams. Sign up
            <span class="italic">now</span> to get started
          </p>
          <p class="header-text">
            You <span class="italic">know</span> you want to.
          </p>
        </div>
        <div class="form-inputs">
          <form id="form" action="" method="post">
            <div class="form-text">Let's do this!</div>
            <div class="controller-container">
              <div class="form-controls">
                <label for="first-name">FIRST NAME</label>
                <input type="text" id="first-name" name="first-name" />
              </div>
              <div class="form-controls">
                <label for="last-name">LAST NAME</label>
                <input type="text" id="last-name" name="last-name" />
              </div>
              <div class="form-controls">
                <label for="user-email">EMAIL</label>
                <input type="email" id="user-email" name="user-email" />
              </div>
              <div class="form-controls">
                <label for="phone">PHONE NUMBER</label>
                <input type="tel" id="phone" name="phone" />
              </div>
              <div class="form-controls">
                <label for="user-pwd">PASSWORD</label>
                <input type="password" id="user-pwd" name="user-pwd" />
              </div>
              <div class="form-controls">
                <label for="confirm-pwd">CONFIRM PASSWORD</label>
                <input type="password" id="confirm-pwd" name="confirm-pwd" />
              </div>
            </div>
          </form>
        </div>
        <div class="form-buttons">
          <div class="button-container">
            <button class="submit-button" type="submit" form="form">
              Create Account
            </button>
          </div>
          <div>
            <p class="log-in">Already have an account? <a href="">Log in</a></p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
